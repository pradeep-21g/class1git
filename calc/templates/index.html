<!DOCTYPE html>
<html>
<head>
    <title>Python Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            padding-top: 80px;
        }

        .calculator {
            background: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        input, select, button {
            padding: 10px;
            margin: 8px;
            font-size: 16px;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        .result {
            color: green;
            font-size: 24px;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

<div class="calculator">

    <h1>Python Calculator</h1>

    <form action="/calculate" method="POST">

        <input
            type="number"
            step="any"
            name="a"
            placeholder="First number"
            required
        >

        <br>

        <select name="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
        </select>

        <br>

        <input
            type="number"
            step="any"
            name="b"
            placeholder="Second number"
            required
        >

        <br>

        <button type="submit">Calculate</button>

    </form>

    {% if result is defined %}
        <p class="result">Result: {{ result }}</p>
    {% endif %}

    {% if error %}
        <p class="error">Error: {{ error }}</p>
    {% endif %}

</div>

</body>
</html>
